<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Maker Hub · Administration</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0a0e17;--card:#111827;--bd:#1f2937;--neon:#00ff9d;--cy:#00e5ff;--pu:#a855f7;--tx:#e2e8f0;--mut:#94a3b8;--rose:#f43f5e;--amb:#f59e0b;--mono:'JetBrains Mono','SF Mono',Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 Inter,system-ui,sans-serif}
::selection{background:var(--neon);color:#000}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--neon)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
h1,h2,label,th,button,.pr{font-family:var(--mono)}
h1{font-size:22px;margin:14px 0 18px}
h2{font-size:16px;margin:0 0 14px}
.mut{color:var(--mut)}.small{font-size:12px}
.pos{color:var(--neon)}.neg{color:var(--rose)}
.pr{font-size:12px;color:var(--neon)}.pr b{color:#fff}
/* fenêtre terminal */
.win{border:1px solid var(--bd);background:var(--card);border-radius:12px;box-shadow:0 0 25px rgba(0,229,255,.1);max-width:560px}
.wbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);padding:12px 18px}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:rgba(244,63,94,.8)}.dots i+i{background:rgba(245,158,11,.8)}.dots i+i+i{background:rgba(16,185,129,.8)}
.wbody{padding:18px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .win{width:100%;max-width:420px}
#login form{padding:18px 18px 20px}
/* champs */
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--neon);outline:none}
textarea{resize:vertical}
.btn{background:none;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--cy);color:var(--cy)}
.btn.pri{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.35);color:var(--neon);font-weight:700}
.btn.pri:hover{background:rgba(16,185,129,.2)}
.btn:disabled{opacity:.5;cursor:wait}
.wide{width:100%;margin-top:18px;padding:12px}
.msg{min-height:20px;margin:12px 0 0;color:var(--rose);font-size:13px}
/* app */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font:700 14px var(--mono);padding:0 8px}
.mk{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--bd);border-radius:8px;color:var(--neon);font-size:12px}
.brand small{color:var(--cy);font-weight:400;margin-left:auto}
nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-left:2px solid transparent;border-radius:0 8px 8px 0;color:var(--mut);padding:10px 12px;font-size:13px;cursor:pointer;text-align:left}
nav button:hover{color:#fff}
nav button[aria-current=page]{color:var(--neon);border-left-color:var(--neon);background:rgba(0,255,157,.06)}
nav i{width:16px;text-align:center}
.top{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:10px 24px;border-bottom:1px solid var(--bd);background:rgba(17,24,39,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
#view{padding:20px 24px 40px;max-width:1100px}
.hd{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--bd);padding-bottom:10px;font:12px var(--mono)}
.bar{display:flex;gap:10px;margin-bottom:14px}.bar input{max-width:280px}.bar .btn{margin-left:auto}
.note{border:1px solid var(--bd);border-left:3px solid var(--cy);background:var(--card);border-radius:8px;padding:10px 14px;margin-bottom:14px;color:var(--mut);font-size:13px}
.note.err{border-left-color:var(--rose);color:var(--tx)}
/* tableau */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;white-space:nowrap}
th{font-size:12px;font-weight:500;color:var(--mut);border-bottom:1px solid var(--bd)}
td{border-bottom:1px solid rgba(31,41,55,.6);max-width:320px;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(0,229,255,.04)}
td.ac{text-align:right;width:1%}
.ic{background:none;border:0;color:var(--mut);cursor:pointer;padding:6px 8px;border-radius:6px}
.ic:hover{color:var(--cy)}.ic.del:hover{color:var(--rose)}
.b{display:inline-block;padding:1px 9px;border-radius:999px;font:500 12px var(--mono);border:1px solid var(--bd);color:var(--mut)}
.b.g{color:var(--neon);border-color:rgba(0,255,157,.35)}.b.c{color:var(--cy);border-color:rgba(0,229,255,.35)}.b.r{color:var(--rose);border-color:rgba(244,63,94,.4)}.b.a{color:var(--amb);border-color:rgba(245,158,11,.4)}.b.p{color:var(--pu);border-color:rgba(168,85,247,.4)}
/* statut */
.kv{margin:0;font:13px var(--mono)}
.kv div{display:flex;align-items:baseline;gap:8px;padding:6px 0}
.kv dt{color:var(--mut)}.kv dd{margin:0;color:#fff}.kv i{flex:1;border-bottom:1px dotted var(--bd)}
.win.full{max-width:none;margin-bottom:22px}
.logs{list-style:none;margin:0;padding:0;font-size:13px}
.logs li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid rgba(31,41,55,.6)}.logs li:last-child{border:0}
.logs time{color:var(--mut);font-family:var(--mono);font-size:12px;flex:none}
/* dialogue */
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:22px;width:min(520px,calc(100vw - 24px));max-height:90vh;box-shadow:0 0 25px rgba(0,229,255,.1)}
dialog::backdrop{background:rgba(5,8,14,.75)}
.act{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
#toast{position:fixed;right:16px;bottom:16px;background:var(--card);border:1px solid var(--neon);border-radius:8px;padding:10px 16px;font:13px var(--mono);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:none}#toast.bad{border-color:var(--rose)}
@media(max-width:800px){
#app{grid-template-columns:1fr}
aside{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:0 0 env(safe-area-inset-bottom);border-right:0;border-top:1px solid var(--bd);z-index:20}
.brand{display:none}
nav{display:flex;width:100%}
nav button{flex:1;flex-direction:column;gap:3px;font-size:10px;padding:9px 2px;border-left:0;border-top:2px solid transparent;border-radius:0;justify-content:center;text-align:center}
nav button[aria-current=page]{border-top-color:var(--neon)}
.top{padding:10px 14px}#view{padding:14px 14px 90px}
.bar input{max-width:none;flex:1}#toast{bottom:84px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main id="login">
  <div class="win">
    <div class="wbar"><span class="pr"><b>root@maker-hub</b>:$ sudo login --admin</span><span class="dots"><i></i><i></i><i></i></span></div>
    <form id="lf">
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="username" required placeholder="administration.makerhub@gmail.com">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <p id="lm" class="msg" role="alert"></p>
      <button class="btn pri wide" id="lb">Se connecter</button>
      <p class="mut small" style="margin:14px 0 0">Accès réservé à l'équipe. Les comptes se créent uniquement dans Supabase.</p>
    </form>
  </div>
</main>

<div id="app" hidden>
  <aside>
    <div class="brand"><span class="mk">MH</span>Maker Hub<small>admin</small></div>
    <nav id="nav" aria-label="Sections"></nav>
  </aside>
  <div>
    <div class="top"><span id="who" class="mut small"></span><button class="btn" id="out"><i class="fa-solid fa-right-from-bracket"></i> Se déconnecter</button></div>
    <main id="view"></main>
  </div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script type="module">
/* ───────── Config ───────── */
const CFG = { url: 'https://fjcyadzqszdujjbwfrhu.supabase.co', key: 'sb_publishable_y2SFirW9y8YNS2bGRPjqag_KyqvC9z7' };
const sb = window.supabase.createClient(CFG.url, CFG.key);
const $ = s => document.querySelector(s);

const L = { libelle:'Libellé', type:'Type', montant:'Montant', categorie:'Catégorie', date:'Date', email:'Email', pseudo:'Pseudo', role:'Rôle', created_at:'Créé le', titre:'Titre', statut:'Statut', niveau:'Niveau', nom:'Nom', responsable:'Responsable', contenu:'Contenu', description:'Description' };
const ST = { articles:['brouillon','publié'], formations:['planifié','en cours','publié'], projets:['idée','en cours','pause','terminé'] };
const SECTIONS = {
  home:   { label:'Globale', title:'Vue globale', icon:'fa-house', cmd:'./status --all' },
  budget: { label:'Budget', title:'Gestion budgétaire', icon:'fa-coins', cmd:'cat ./budget.csv', table:'budget', order:'date', add:'Nouvelle écriture',
    cols:['libelle','type','montant','categorie','date'],
    fields:[{k:'libelle',t:'text',req:1},{k:'type',t:'select',o:['recette','dépense']},{k:'montant',t:'number',req:1},{k:'categorie',t:'text'},{k:'date',t:'date'}] },
  users:  { label:'Membres', title:'Gestion utilisateurs', icon:'fa-users', cmd:'ls ./users', table:'profiles', readonly:true,
    cols:['email','pseudo','role','created_at'] },
  articles:{ label:'Articles', title:'Gestion articles', icon:'fa-pen-nib', cmd:'ls -la ./articles', table:'articles', add:'Nouvel article',
    cols:['titre','categorie','statut','created_at'],
    fields:[{k:'titre',t:'text',req:1},{k:'categorie',t:'text'},{k:'statut',t:'select',o:ST.articles},{k:'contenu',t:'textarea'}] },
  formations:{ label:'Formation', title:'Gestion formation', icon:'fa-graduation-cap', cmd:'find ./formations -name "*.md"', table:'formations', add:'Nouvelle formation',
    cols:['titre','niveau','statut','created_at'],
    fields:[{k:'titre',t:'text',req:1},{k:'niveau',t:'select',o:['1','2','3']},{k:'statut',t:'select',o:ST.formations},{k:'description',t:'textarea'}] },
  projets:{ label:'Projets', title:'Gestion projet', icon:'fa-rocket', cmd:'ls ./projets', table:'projets', add:'Nouveau projet',
    cols:['nom','responsable','statut','created_at'],
    fields:[{k:'nom',t:'text',req:1},{k:'responsable',t:'text'},{k:'statut',t:'select',o:ST.projets},{k:'description',t:'textarea'}] }
};

/* ───────── UI ───────── */
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TONE = {'publié':'g','terminé':'g','recette':'g','admin':'g','en cours':'c','dépense':'r','brouillon':'a','idée':'a','planifié':'a','pause':'p'};
const UI = {
  eur: n => new Intl.NumberFormat('fr-BE', {style:'currency', currency:'EUR'}).format(n || 0),
  badge: v => `<span class="b ${TONE[v] || ''}">${esc(v)}</span>`,
  toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = bad ? 'show bad' : 'show'; clearTimeout(UI.t); UI.t = setTimeout(() => t.className = '', 3200); },
  win: (cmd, body) => `<div class="win full"><div class="wbar"><span class="pr"><b>admin@maker-hub</b>:$ ${cmd}</span><span class="dots"><i></i><i></i><i></i></span></div><div class="wbody">${body}</div></div>`,
  kv: rows => `<dl class="kv">${rows.map(([k, v, c]) => `<div><dt>${k}</dt><i></i><dd class="${c || ''}">${v}</dd></div>`).join('')}</dl>`,
  head: s => `<div class="hd"><span class="pr"><b>admin@maker-hub</b>:$ ${s.cmd}</span><span class="mut">[${s.label}]</span></div><h1>${s.title}</h1>`,
  fail: e => `<div class="note err">Erreur : ${esc(e.message)}. Si une table est introuvable, exécutez <b>setup.sql</b> dans l'éditeur SQL de Supabase.</div>`,
  cell(k, v, r) {
    if (v == null || v === '') return '<span class="mut">—</span>';
    if (k === 'created_at') return esc(new Date(v).toLocaleDateString('fr-BE'));
    if (k === 'date') return esc(new Date(v + 'T00:00').toLocaleDateString('fr-BE'));
    if (k === 'montant') { const d = r.type === 'dépense'; return `<span class="${d ? 'neg' : 'pos'}">${d ? '−' : '+'}${UI.eur(v)}</span>`; }
    if (['statut', 'type', 'role'].includes(k)) return UI.badge(v);
    if (k === 'niveau') return 'Niveau ' + esc(v);
    return esc(v);
  }
};

/* ───────── Données (CRUD générique) ───────── */
let user = null, cache = {}, current = 'home';
const view = $('#view'), dlg = $('#dlg');
const Data = {
  log: (action, cible) => sb.from('logs').insert({ action, cible, user_email: user.email }).then(() => {}, () => {}),
  async save(key, id, row) {
    const t = SECTIONS[key].table;
    const { error } = id ? await sb.from(t).update(row).eq('id', id) : await sb.from(t).insert(row);
    if (!error) Data.log(id ? 'modification' : 'création', `${t} · ${row[SECTIONS[key].cols[0]]}`);
    return error;
  },
  async remove(key, id) {
    const s = SECTIONS[key], name = cache[id]?.[s.cols[0]];
    const { error } = await sb.from(s.table).delete().eq('id', id);
    if (!error) Data.log('suppression', `${s.table} · ${name}`);
    return error;
  }
};

/* ───────── Vues ───────── */
const Views = {
  async home() {
    view.innerHTML = UI.head(SECTIONS.home) + '<p class="mut">Chargement…</p>';
    const cnt = (t, f) => { let q = sb.from(t).select('*', { count:'exact', head:true }); if (f) q = q.eq(f[0], f[1]); return q.then(r => r.error ? '?' : r.count); };
    const [art, brou, form, proj, cours, mem, bud, logs] = await Promise.all([
      cnt('articles'), cnt('articles', ['statut','brouillon']), cnt('formations'), cnt('projets'), cnt('projets', ['statut','en cours']), cnt('profiles'),
      sb.from('budget').select('montant,type'), sb.from('logs').select('*').order('created_at', { ascending:false }).limit(8)
    ]);
    const rows = bud.data || [], sum = t => rows.filter(r => r.type === t).reduce((a, r) => a + Number(r.montant), 0);
    const solde = sum('recette') - sum('dépense');
    const status = UI.kv([
      ['articles', `${art} <span class="mut">(${brou} en brouillon)</span>`],
      ['formations', form], ['projets', `${proj} <span class="mut">(${cours} en cours)</span>`], ['membres', mem],
      ['solde', UI.eur(solde), solde < 0 ? 'neg' : 'pos']
    ]);
    const list = logs.data?.length
      ? `<ul class="logs">${logs.data.map(l => `<li><time>${esc(new Date(l.created_at).toLocaleString('fr-BE', {dateStyle:'short', timeStyle:'short'}))}</time><span><span class="mut">${esc(l.user_email)}</span> · ${esc(l.action)} · ${esc(l.cible)}</span></li>`).join('')}</ul>`
      : '<p class="mut" style="margin:0">Aucune activité enregistrée. Les créations, modifications et suppressions apparaîtront ici.</p>';
    view.innerHTML = UI.head(SECTIONS.home) + UI.win('./status --all', status) + UI.win('tail ./logs', list);
  },

  async list(key) {
    const s = SECTIONS[key];
    view.innerHTML = UI.head(s) + '<p class="mut">Chargement…</p>';
    const { data, error } = await sb.from(s.table).select('*').order(s.order || 'created_at', { ascending:false }).limit(200);
    if (error) { view.innerHTML = UI.head(s) + UI.fail(error); return; }
    cache = Object.fromEntries(data.map(r => [r.id, r]));
    let extra = '';
    if (key === 'budget') {
      const t = x => data.filter(r => r.type === x).reduce((a, r) => a + Number(r.montant), 0);
      extra = UI.win('./balance', UI.kv([['recettes', UI.eur(t('recette')), 'pos'], ['dépenses', UI.eur(t('dépense')), 'neg'], ['solde', UI.eur(t('recette') - t('dépense'))]]));
    }
    const note = s.readonly ? '<div class="note"><i class="fa-solid fa-lock"></i> Lecture seule. Aucun compte ne se crée depuis ce panneau : ajoutez-les dans Supabase (Authentication → Users).</div>' : '';
    const bar = `<div class="bar"><input type="search" id="q" placeholder="Filtrer la liste" aria-label="Filtrer la liste">${s.readonly ? '' : `<button class="btn pri" data-act="new"><i class="fa-solid fa-plus"></i> ${s.add}</button>`}</div>`;
    const body = data.length ? data.map(r => `<tr>${s.cols.map(k => `<td>${UI.cell(k, r[k], r)}</td>`).join('')}${s.readonly ? '' : `<td class="ac"><button class="ic" data-act="edit" data-id="${esc(r.id)}" aria-label="Modifier"><i class="fa-solid fa-pen"></i></button><button class="ic del" data-act="del" data-id="${esc(r.id)}" aria-label="Supprimer"><i class="fa-solid fa-trash"></i></button></td>`}</tr>`).join('')
      : `<tr><td colspan="${s.cols.length + 1}" class="mut">${s.readonly ? 'Aucun utilisateur. Les profils apparaissent à la première connexion.' : `Rien ici pour le moment. Cliquez sur « ${s.add} » pour commencer.`}</td></tr>`;
    view.innerHTML = UI.head(s) + extra + note + bar + `<div class="tw"><table><thead><tr>${s.cols.map(k => `<th>${L[k]}</th>`).join('')}${s.readonly ? '' : '<th></th>'}</tr></thead><tbody>${body}</tbody></table></div>`;
    $('#q').addEventListener('input', e => { const v = e.target.value.toLowerCase(); view.querySelectorAll('tbody tr').forEach(tr => tr.hidden = !tr.textContent.toLowerCase().includes(v)); });
  },

  form(key, id) {
    const s = SECTIONS[key], r = id ? cache[id] : { date: new Date().toISOString().slice(0, 10) };
    const field = f => {
      const v = r[f.k], a = `id="f_${f.k}" name="${f.k}"${f.req ? ' required' : ''}`;
      const c = f.t === 'select' ? `<select ${a}>${f.o.map(o => `<option${o == v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
        : f.t === 'textarea' ? `<textarea ${a} rows="6">${esc(v)}</textarea>`
        : `<input ${a} type="${f.t}"${f.t === 'number' ? ' step="0.01" min="0"' : ''} value="${esc(v)}">`;
      return `<label for="f_${f.k}">${L[f.k]}</label>${c}`;
    };
    dlg.innerHTML = `<form id="f"><h2>${id ? 'Modifier' : s.add}</h2>${s.fields.map(field).join('')}<div class="act"><button type="button" class="btn" data-close>Annuler</button><button class="btn pri">Enregistrer</button></div></form>`;
    $('#f').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target), row = {};
      s.fields.forEach(f => { const v = String(fd.get(f.k)).trim(); row[f.k] = v === '' ? null : f.t === 'number' ? Number(v) : v; });
      const err = await Data.save(key, id, row);
      if (err) return UI.toast(err.message, true);
      dlg.close(); UI.toast('Enregistré'); Views.list(key);
    };
    dlg.showModal();
  }
};

/* ───────── Navigation ───────── */
const Nav = {
  build() {
    $('#nav').innerHTML = Object.entries(SECTIONS).map(([k, s]) => `<button data-go="${k}"><i class="fa-solid ${s.icon}"></i><span>${s.label}</span></button>`).join('');
  },
  go() {
    const k = location.hash.slice(1);
    current = SECTIONS[k] ? k : 'home';
    document.querySelectorAll('#nav button').forEach(b => b.toggleAttribute('aria-current', b.dataset.go === current) || b.removeAttribute('aria-current'));
    document.querySelectorAll('#nav button').forEach(b => b.dataset.go === current && b.setAttribute('aria-current', 'page'));
    current === 'home' ? Views.home() : Views.list(current);
  }
};
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) { location.hash = b.dataset.go; if (location.hash.slice(1) === current) Nav.go(); } });
window.addEventListener('hashchange', () => user && Nav.go());
view.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, id } = b.dataset, key = current;
  if (act === 'new') Views.form(key);
  if (act === 'edit') Views.form(key, id);
  if (act === 'del' && confirm(`Supprimer « ${cache[id]?.[SECTIONS[key].cols[0]] ?? 'cet élément'} » ? Cette action est définitive.`)) {
    const err = await Data.remove(key, id);
    err ? UI.toast(err.message, true) : (UI.toast('Supprimé'), Views.list(key));
  }
});
dlg.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === dlg) dlg.close(); });

/* ───────── Authentification ───────── */
const Auth = {
  fails: 0, lock: 0,
  msg: t => $('#lm').textContent = t,
  showLogin() { user = null; view.innerHTML = ''; $('#app').hidden = true; $('#login').hidden = false; $('#pw').value = ''; },
  async enter(session) {
    // La vraie protection est la RLS côté base : ici on vérifie seulement que le compte est admin.
    const { data, error } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
    if (error || !data) {
      await sb.auth.signOut(); Auth.showLogin();
      return Auth.msg(error ? 'Droits impossibles à vérifier (table « admins » absente ? voir setup.sql).' : "Ce compte n'a pas les droits d'administration.");
    }
    user = session.user; $('#who').textContent = user.email;
    $('#login').hidden = true; $('#app').hidden = false; Nav.build(); Nav.go();
  },
  async submit(e) {
    e.preventDefault(); Auth.msg('');
    const wait = Math.ceil((Auth.lock - Date.now()) / 1000);
    if (wait > 0) return Auth.msg(`Trop d'essais. Réessayez dans ${wait} s.`);
    const btn = $('#lb'); btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    btn.disabled = false;
    if (error) {
      if (error.status !== 400 && error.code !== 'invalid_credentials') return Auth.msg(`Connexion impossible : ${error.message}`);
      if (++Auth.fails >= 5) { Auth.lock = Date.now() + 30000; Auth.fails = 0; }
      return Auth.msg(error.code === 'email_not_confirmed' ? 'Email non confirmé dans Supabase.' : 'Identifiants incorrects.');
    }
    Auth.fails = 0; Auth.enter(data.session);
  },
  async init() {
    $('#lf').addEventListener('submit', Auth.submit);
    $('#out').addEventListener('click', () => sb.auth.signOut());
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') Auth.showLogin(); });
    const { data } = await sb.auth.getSession();
    data.session ? Auth.enter(data.session) : Auth.showLogin();
  }
};
Auth.init();
</script>
</body>
</html>
